<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Date Validator</h1>

    <div>
        <label for="day">Day:</label>
        <input type="number" id="day" name="day" placeholder="DD" min="1" max="31">

        <label for="month">Month:</label>
        <input type="number" id="month" name="month" placeholder="MM" min="1" max="12">

        <label for="year">Year:</label>
        <input type="number" id="year" name="year" placeholder="YYYY">
    </div>

    <button id="validateButton">Check Date</button>

    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
