<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Validator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Consider adding a link to an icon library like Font Awesome if desired, or use SVG/CSS icons -->
    <!-- For example, if using Font Awesome: -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> -->
</head>
<body>
    <div class="validator-container">
        <h1>Date Validator</h1>

        <div class="input-group">
            <div>
                <label for="day">Day:</label>
                <input type="number" id="day" name="day" placeholder="DD" min="1" max="31">
            </div>
            <div>
                <label for="month">Month:</label>
                <input type="number" id="month" name="month" placeholder="MM" min="1" max="12">
            </div>
            <div>
                <label for="year">Year:</label>
                <input type="number" id="year" name="year" placeholder="YYYY">
            </div>
        </div>

        <button id="validateButton">Check Date</button>
        <div id="result">
            <span class="icon"></span> <!-- Placeholder for icon -->
            <span class="message"></span> <!-- For the text message -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
