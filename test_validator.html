<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Date Validator Logic</title>
    <link rel="stylesheet" href="style.css"> <!-- Optional: for consistent styling -->
    <style>
        body { padding: 20px; font-family: sans-serif; }
        .test-case { margin-bottom: 10px; border: 1px solid #eee; padding: 10px; background-color: #f9f9f9; border-radius: 4px;}
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        h1, h2 { border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 15px;}
        /* Minimal styles for inputs if main CSS not loaded or overridden */
        input[type="number"] { width: 60px; margin-right: 5px; padding: 5px; border: 1px solid #ccc; border-radius: 3px;}
        button { padding: 8px 12px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;}
        button:hover { background-color: #0056b3;}
        #manualResult { margin-top:10px; font-weight:bold; padding: 5px; border-radius:3px; min-height:1.5em;}
    </style>
</head>
<body>
    <h1>Date Validator - Test Page</h1>

    <!-- Manual Test Area -->
    <h2>Manual Test</h2>
    <div class="validator-container" style="max-width:none; box-shadow:none; padding:10px 0;"> <!-- Mimic container for inputs -->
        <div class="input-group">
             <div>
                <label for="manualDay">Day:</label>
                <input type="number" id="manualDay" placeholder="DD">
            </div>
            <div>
                <label for="manualMonth">Month:</label>
                <input type="number" id="manualMonth" placeholder="MM">
            </div>
            <div>
                <label for="manualYear">Year:</label>
                <input type="number" id="manualYear" placeholder="YYYY">
            </div>
        </div>
        <button id="manualValidateButton">Check Date Manually</button>
        <div id="manualResult"></div> <!-- Separate result div for manual test -->
    </div>
    <hr style="margin: 20px 0;">

    <h2>Automated Test Cases</h2>
    <div id="test-results"></div>

    <!-- These are the actual input fields script.js will use for automated tests -->
    <input type="hidden" id="day">
    <input type="hidden" id="month">
    <input type="hidden" id="year">
    <div id="result" style="display:none;"><span class="icon"></span><span class="message"></span></div> 

    <script src="script.js"></script>
    <script>
        const testCases = [
            // Valid dates
            { day: 1, month: 1, year: 2023, expected: 'Date is valid!', description: 'Valid date (Jan 1, 2023)' },
            { day: 29, month: 2, year: 2024, expected: 'Date is valid!', description: 'Valid leap day (Feb 29, 2024)' },
            // ... (other test cases from before, ensure they match new error messages if any) ...
            { day: 31, month: 4, year: 2023, expected: 'Invalid day. April 2023 has only 30 days.', description: 'Invalid day for April (Apr 31, 2023)' },
            { day: 29, month: 2, year: 2023, expected: 'Invalid day. February 2023 has only 28 days.', description: 'Invalid leap day in non-leap year (Feb 29, 2023)' },
            { day: 1, month: 0, year: 2023, expected: 'Month must be between 1 and 12.', description: 'Invalid month (0)' },
            { day: 1, month: 13, year: 2023, expected: 'Month must be between 1 and 12.', description: 'Invalid month (13)' },
            { day: 1, month: 1, year: 999, expected: 'Year must be a 4-digit number (e.g., 1990).', description: 'Invalid year (999)' },
            { day: 1, month: 1, year: 10000, expected: 'Year must be a 4-digit number (e.g., 1990).', description: 'Invalid year (10000)' },
            { day: 'a', month: 1, year: 2023, expected: 'Please enter valid numbers for day, month, and year.', description: 'Non-numeric day' },
            { day: 0, month: 1, year: 2023, expected: 'Day cannot be less than 1.', description: 'Day less than 1' },

        ];

        const resultsContainer = document.getElementById('test-results');
        
        // For manual testing
        const manualDayInput = document.getElementById('manualDay');
        const manualMonthInput = document.getElementById('manualMonth');
        const manualYearInput = document.getElementById('manualYear');
        const manualResultDiv = document.getElementById('manualResult');
        const manualButton = document.getElementById('manualValidateButton');

        // Hidden inputs that script.js will use for automated tests
        const autoDayInput = document.getElementById('day');
        const autoMonthInput = document.getElementById('month');
        const autoYearInput = document.getElementById('year');
        const autoResultDiv = document.getElementById('result'); // This is the div script.js updates
        const autoResultMessageSpan = autoResultDiv.querySelector('.message');

        manualButton.addEventListener('click', () => {
            // Set values on the hidden inputs that script.js uses
            autoDayInput.value = manualDayInput.value;
            autoMonthInput.value = manualMonthInput.value;
            autoYearInput.value = manualYearInput.value;
            
            validateDate(); // Call the global function

            // Display result in the manual test area
            manualResultDiv.textContent = autoResultMessageSpan.textContent;
            if (autoResultDiv.classList.contains('valid')) {
                manualResultDiv.className = 'pass';
            } else if (autoResultDiv.classList.contains('invalid')) {
                manualResultDiv.className = 'fail';
            } else {
                manualResultDiv.className = '';
            }
        });

        let allTestsPassed = true;
        testCases.forEach(tc => {
            autoDayInput.value = tc.day;
            autoMonthInput.value = tc.month;
            autoYearInput.value = tc.year;

            validateDate(); // This function directly updates 'autoResultDiv' and its children

            const actualMessage = autoResultMessageSpan.textContent;
            const pass = actualMessage === tc.expected;
            if (!pass) allTestsPassed = false;

            const testCaseResultDiv = document.createElement('div');
            testCaseResultDiv.classList.add('test-case');
            testCaseResultDiv.innerHTML = \`
                <strong>\${tc.description}</strong><br>
                Input: Day=\${tc.day}, Month=\${tc.month}, Year=\${tc.year}<br>
                Expected: "\${tc.expected}"<br>
                Actual: "\${actualMessage}"<br>
                Result: <span class="\${pass ? 'pass' : 'fail'}">\${pass ? 'PASSED' : 'FAILED'}</span>
            \`;
            resultsContainer.appendChild(testCaseResultDiv);
        });
        
        const summaryDiv = document.createElement('h3');
        summaryDiv.textContent = allTestsPassed ? 'All automated tests PASSED!' : 'Some automated tests FAILED.';
        summaryDiv.className = allTestsPassed ? 'pass' : 'fail';
        resultsContainer.insertBefore(summaryDiv, resultsContainer.firstChild);

        // Clear hidden input values after running tests
        autoDayInput.value = '';
        autoMonthInput.value = '';
        autoYearInput.value = '';
        autoResultDiv.classList.remove('valid', 'invalid');
        autoResultMessageSpan.textContent = '';

    </script>
</body>
</html>
